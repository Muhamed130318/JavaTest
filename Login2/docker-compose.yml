services:
  db:
    container_name: ClientLogin
    image: postgres:latest
    environment:
      POSTGRES_USER: muhamed
      POSTGRES_PASSWORD: admin
      PGDATA: /data/postgres
    volumes:
      - db:/data/postgres
    ports:
      - "5331:5432"
    networks:
      - db
    restart: unless-stopped

networks:
  db:
    driver: bridge

volumes:
  db: